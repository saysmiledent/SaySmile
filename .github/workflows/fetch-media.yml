name: fetch-media
# Relay: downloads files whose URLs are pushed as fetch/requests/<name>.url
# and commits them to fetch/out/<name> on this branch.
on:
  push:
    branches: [media]
    paths: ['fetch/requests/*.url']
permissions:
  contents: write
concurrency:
  group: fetch-media
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download requested files
        run: |
          set -euo pipefail
          mkdir -p fetch/out
          shopt -s nullglob
          for f in fetch/requests/*.url; do
            name="$(basename "$f" .url)"
            url="$(head -n1 "$f" | tr -d '\r\n')"
            echo "Fetching $name"
            curl -fsSL --retry 3 "$url" -o "fetch/out/$name"
            ls -la "fetch/out/$name"
            git rm -q "$f"
          done
      - name: Commit
        run: |
          git config user.name "SaySmile Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fetch
          git commit -m "Fetched media [skip ci]" || exit 0
          git push
