name: Preview build (no deploy)

# Builds the site from work branches and keeps the result as a downloadable artifact for review.
# Nothing is published: only deploy.yml (live branch) changes the public site.
on:
  push:
    branches: [home-dantora]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx astro build
      # the built pages go to the branch preview-dist (overwritten each time), so they can be fetched with git
      - name: Push the build to preview-dist
        run: |
          cd dist
          git init -q -b preview-dist
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" preview-dist
